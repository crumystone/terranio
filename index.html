<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Terranio">
  <meta name="theme-color" content="#0F172A">
  <meta name="description" content="Terranio — Master capitals across the Americas & Europe">
  
  <title>Terranio</title>
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">
  
  <!-- Icons -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icon-152.png">
  <link rel="apple-touch-icon" sizes="120x120" href="icon-120.png">
  
  <!-- Splash screens for iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #root {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      background: #0F172A;
      -webkit-tap-highlight-color: transparent;
    }
    /* Prevent pull-to-refresh on mobile */
    body { overscroll-behavior-y: contain; }
    /* Safe area padding for notched devices */
    body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <!-- React 18 from CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX transformation (could be precompiled for production) -->
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <script>
    // Polyfill window.storage API using localStorage
    // This replaces Claude's artifact storage with browser localStorage
    window.storage = {
      async get(key) {
        try {
          const value = localStorage.getItem('terranio_' + key);
          if (value === null) throw new Error('Key not found');
          return { key, value };
        } catch (e) {
          throw e;
        }
      },
      async set(key, value) {
        try {
          localStorage.setItem('terranio_' + key, value);
          return { key, value };
        } catch (e) {
          return null;
        }
      },
      async delete(key) {
        try {
          localStorage.removeItem('terranio_' + key);
          return { key, deleted: true };
        } catch (e) {
          return null;
        }
      },
      async list(prefix) {
        const keys = [];
        const fullPrefix = 'terranio_' + (prefix || '');
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k.startsWith(fullPrefix)) {
            keys.push(k.replace('terranio_', ''));
          }
        }
        return { keys };
      }
    };
  </script>

  <!-- App Component (loaded from external file for maintainability) -->
  <script type="text/babel" src="app-component.jsx"></script>
  
  <!-- Mount the app -->
  <script type="text/babel">
    ReactDOM.createRoot(document.getElementById('root')).render(
      React.createElement(GeographyApp)
    );
  </script>
  
  <!-- Service Worker Registration for offline support -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {
          // Service worker not available, app still works without it
        });
      });
    }
  </script>
</body>
</html>
